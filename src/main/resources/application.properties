spring.profiles.active=dev

app.jwt.base64-secret=${JWT_SECRET}
app.jwt.access-token-validity-in-seconds=86400
app.jwt.refresh-token-validity-in-seconds=604800

app.upload-file.base-uri=${UPLOAD_PATH:file:///app/uploads/}

spring.data.web.pageable.one-indexed-parameters=true

# cho sử dụng [ và ] trên url
server.tomcat.relaxed-query-chars=[,]

# Email admin nhận thông báo khi Mentor gửi lại hồ sơ
app.admin.email=admin@mentoria.com

# ===== Stripe =====
stripe.api-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.platform-fee-percent=20
stripe.success-url=https://mentora.tahidve.live/booking/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=https://mentora.tahidve.live/booking/cancel

# ===== Actuator (cho Docker healthcheck) =====
# Chỉ expose endpoint /health, không lộ info nội bộ
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

