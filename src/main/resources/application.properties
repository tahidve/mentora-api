spring.profiles.active=dev

app.jwt.base64-secret=${JWT_SECRET}
app.jwt.access-token-validity-in-seconds=86400
app.jwt.refresh-token-validity-in-seconds=604800

app.upload-file.base-uri=file:///D:/pet_project/uploads/mentora-uploads/

spring.data.web.pageable.one-indexed-parameters=true

# cho sử dụng [ và ] trên url
server.tomcat.relaxed-query-chars=[,]

# Email admin nhận thông báo khi Mentor gửi lại hồ sơ
app.admin.email=admin@mentoria.com

# ===== Stripe =====
stripe.api-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
stripe.platform-fee-percent=20
stripe.success-url=http://localhost:5173/booking/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:5173/booking/cancel
